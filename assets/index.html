<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门套餐侦探 · 出 2 套方案 / 手气抽 1 套</title>
<style>
  :root {
    --red: #da291c; --yellow: #ffc72c;
    --bg: #faf7f2; --card: #fff;
    --ink: #2b2320; --muted: #8a7f78; --line: #ece5dc;
    --green: #2e9e5b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; padding-bottom: 60px;
  }
  .header {
    background: var(--red); color: #fff;
    padding: 30px 20px 24px; text-align: center;
    position: relative; overflow: hidden;
  }
  .header::after {
    content: ""; position: absolute; right: -50px; top: -50px;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,199,44,.25);
  }
  .header h1 { font-size: 24px; letter-spacing: 1px; }
  .header p { font-size: 13px; opacity: .85; margin-top: 8px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 26px 22px; margin-top: 22px;
    box-shadow: 0 2px 12px rgba(80,60,40,.06);
  }
  .home-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .big-btn {
    padding: 18px; border-radius: 14px; border: none; cursor: pointer;
    font-size: 17px; font-weight: bold; transition: all .15s;
  }
  .big-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .btn-red { background: var(--red); color: #fff; }
  .btn-yellow { background: var(--yellow); color: var(--ink); }
  .btn-dark { background: var(--ink); color: #fff; }
  .home-desc { font-size: 13px; color: var(--muted); line-height: 1.8; text-align: left; margin-top: 18px; }
  .dots { display: flex; gap: 7px; justify-content: center; margin-bottom: 18px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); transition: all .2s; }
  .dots i.on { background: var(--red); transform: scale(1.2); }
  .q-no { font-size: 12px; color: var(--muted); letter-spacing: 2px; text-align: center; }
  .q-title { font-size: 19px; font-weight: bold; margin: 8px 0 4px; text-align: center; }
  .q-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; text-align: center; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    padding: 15px 16px; border: 1.5px solid var(--line); border-radius: 14px;
    cursor: pointer; font-size: 15.5px; font-weight: bold; transition: all .15s; background: #fff;
  }
  .opt small { display: block; color: var(--muted); font-size: 12px; font-weight: normal; margin-top: 4px; }
  .opt:hover { border-color: var(--yellow); background: #fffdf5; transform: translateY(-2px); }
  .back-btn { margin-top: 16px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; display: block; margin-inline: auto; }
  .step { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
  .step .s-no {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--yellow); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900; margin-top: 2px;
  }
  .step .s-body { flex: 1; min-width: 0; }
  .step h3 { font-size: 15px; margin-bottom: 8px; }
  .persona-tag {
    display: inline-block; background: #fffbe9; border: 1px solid #f5e3a3;
    border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: bold; color: var(--red);
    margin-bottom: 10px;
  }
  .dimbar { margin-bottom: 8px; }
  .dimbar .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .dimbar .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .dimbar .bar > div { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--red)); border-radius: 999px; }
  .cand {
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 13.5px; background: #fffdf8;
  }
  .cand .score { color: var(--red); font-weight: bold; white-space: nowrap; }
  /* 方案卡 */
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px){ .plans { grid-template-columns: 1fr; } }
  .plan {
    border: 1.5px solid var(--line); border-radius: 14px;
    padding: 16px 14px; background: #fffdf8; text-align: left;
    display: flex; flex-direction: column; gap: 6px;
  }
  .plan.best { border-color: var(--yellow); background: linear-gradient(180deg, #fffdf5, #fff); box-shadow: 0 3px 10px rgba(255,199,44,.25); }
  .plan .p-label {
    align-self: flex-start; font-size: 11.5px; font-weight: bold;
    background: var(--red); color: #fff; border-radius: 999px; padding: 2px 10px;
  }
  .plan .p-label.mild { background: var(--ink); opacity: .75; }
  .plan .p-name { font-size: 17px; font-weight: 900; }
  .plan .p-desc { font-size: 12px; color: var(--muted); }
  .plan .p-price { font-size: 13px; color: var(--muted); }
  .plan .p-price b { color: var(--red); font-size: 20px; }
  .plan .orig { text-decoration: line-through; margin-left: 5px; }
  .plan .save { color: var(--green); font-weight: bold; }
  .plan .p-why { font-size: 12px; color: var(--muted); line-height: 1.7; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: auto; }
  .coupon-note {
    font-size: 12.5px; color: var(--muted); line-height: 1.7;
    background: #fff5f4; border: 1px dashed #f0b9b3; border-radius: 10px; padding: 10px 12px;
  }
  .bottom-btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .small-btn {
    padding: 12px 18px; border-radius: 999px; border: none; cursor: pointer;
    font-size: 14px; font-weight: bold; flex: 1;
  }
  .btn-ghost2 { background: var(--bg); color: var(--ink); border: 1px solid var(--line) !important; }
  .hide { display: none; }
  .note { font-size: 11.5px; color: var(--muted); margin-top: 16px; line-height: 1.7; }
</style>
</head>
<body>

<div class="header">
  <h1>🍔 麦门套餐侦探</h1>
  <p>定位 → 调套餐 → 选最优券 → 出 2 套方案 / 手气抽 1 套</p>
</div>

<div class="wrap">

  <!-- 首页 -->
  <div id="home" class="card">
    <div class="home-btns">
      <button class="big-btn btn-red" onclick="startQuiz()">🧭 开始定位（6 道实物题）</button>
      <button class="big-btn btn-dark" onclick="startMbti()">🧠 性格定位（MBTI 式 · 先分析后推荐）</button>
      <button class="big-btn btn-yellow" onclick="lucky()">🎰 手气套餐（抽 1 套）</button>
      <input id="luckyBudget" type="number" inputmode="decimal" placeholder="预期价格 ¥（可留空 = 不限预算）"
             style="padding:13px 16px; border:1.5px solid var(--line); border-radius:14px; font-size:15px; background:#fff; color:inherit;">
    </div>
    <div class="home-desc">
      侦探工作流：<b>① 定位</b>具体食物画面摸清馋点 → <b>② 调取套餐</b>30 套阵容算匹配度 →
      <b>③ 选最优券</b>逐张比对省最多 → <b>④ 出餐</b>给 <b>2 套方案</b>：🎯最匹配 + 🔄差异备选，不再多而杂。<br>
      不想答题就点<b>手气套餐</b>：随机抽 1 套，可先填预期价格，只从预算内抽。<br>
      想从性格入手就点<b>性格定位</b>：5 题 3 选 1 测出你的麦门人格（MBTI 四轴 + 干饭强度），先给性格分析报告，再按人格推荐套餐。题目来自可替换题库，每次随机轮换。
    </div>
  </div>

  <!-- 测试 -->
  <div id="quiz" class="card hide">
    <div class="dots" id="dots"></div>
    <div class="q-no" id="qNo"></div>
    <div class="q-title" id="qTitle"></div>
    <div class="q-sub" id="qSub"></div>
    <div class="opts" id="opts"></div>
    <button class="back-btn hide" id="backBtn" onclick="prev()">← 上一题</button>
  </div>

  <!-- 结果 -->
  <div id="result" class="hide">
    <div class="card">
      <div class="step">
        <div class="s-no">1</div>
        <div class="s-body"><h3>馋点定位</h3><div id="step1"></div></div>
      </div>
      <div class="step">
        <div class="s-no">2</div>
        <div class="s-body"><h3>调取可点套餐</h3><div id="step2"></div></div>
      </div>
      <div class="step">
        <div class="s-no">3</div>
        <div class="s-body"><h3>最优优惠券与搭配</h3><div id="step3"></div></div>
      </div>
      <div class="step">
        <div class="s-no">4</div>
        <div class="s-body"><h3 id="step4Title">出餐</h3><div id="step4"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="bottom-btns">
        <button class="small-btn btn-ghost2" onclick="location.reload()">↺ 重新测</button>
        <button class="small-btn btn-yellow" onclick="lucky()">🎰 重抽 1 套</button>
      </div>
      <div class="note" id="finalNote"></div>
    </div>
  </div>
</div>

/* 每次测试从选项池随机抽 3 个，保证每次体验不同（MBTI 模式固定 2 选项全量出现） */
let sessionOpts = [];
let mode = "quiz"; // quiz | mbti
function shuffle(arr){
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function rollSessionOpts(){
  if (mode === "mbti"){
    // 性格模式：每轴随机抽 1 个变体 → 5 题 × 3 选项，题库自动轮换
    sessionQ = []; sessionOpts = [];
    for (const axis of MBTI_BANK){
      const v = axis.variants[Math.floor(Math.random() * axis.variants.length)];
      sessionQ.push({ q: v.q, sub: v.sub });
      sessionOpts.push(v.opts);
    }
  } else {
    sessionQ = QUESTIONS.map(q => ({ q: q.q, sub: q.sub }));
    sessionOpts = QUESTIONS.map(q => shuffle(q.opts).slice(0, 3));
  }
}

    v:{ salty:1.5, fresh:2, cool:1.5, light:1.5, sweet:0.3, meat:-0.5 }, why:"要的不是一顿饭，是'咸脆+冰爽'的嘴部按摩——薯条配柠檬水，微酸中和咸香。" },
  { name:"1+1 随心配（堡 + 饮）", desc:"小红卡任选：汉堡 + 饮料", price:13.9, mcpPrice:13.9,
    v:{ meat:0.8, fresh:0.8, light:1.8, salty:0.8, sweet:0.5, hearty:0.5, cool:0.5 }, why:"信号均衡、没有极端渴望——13.9 随心配就是为'都行但想吃点'发明的，性价比满分。" },
  { name:"麦乐鸡盒（分享装）", desc:"大份鸡盒：堡+鸡+派+饮，够 2-3 人", price:69, mcpPrice:69,
    v:{ meat:2.2, hearty:2.2, salty:2, sweet:0.5, cool:0.5, light:-1.5 }, why:"每个答案都在说'再多来点'——鸡盒一次集齐堡、鸡、派，适合你或你和一个同样能吃的朋友。" }
];

/* 内置券库（模拟麦麦省；MCP 生效后换 query-store-coupons 真实券） */
const COUPONS = [
  { id:"c1", name:"满 25 减 4", type:"full", cond:25, cut:4, fit:()=>true },
  { id:"c2", name:"板烧/鳕鱼系主堡半价", type:"mcp", cut:0.5, fit:c=>/板烧|麦香鱼|鳕鱼|苹板|专薯鱼/.test(c.name) },
  { id:"c3", name:"甜品立减券", type:"mcp", cut:0.5, fit:c=>/麦旋风|圆筒|派|雪冰|阿芙佳朵/.test(c.name) },
  { id:"c4", name:"指定套餐 8 折券", type:"ratio", ratio:0.8, fit:c=>/堡套餐|鸡盒|安格斯|牛气满满|果然多肉|巨无霸/.test(c.name) },
  { id:"c5", name:"小食半价券（麦乐鸡/薯条/鸡排/鸡翅）", type:"mcp", cut:0.5, fit:c=>/麦乐鸡|薯条|鸡排|脆汁鸡|V翅/.test(c.name) },
  { id:"c6", name:"随心配不涨价（已是底价）", type:"none", fit:c=>/随心配/.test(c.name) }
];

let qi = 0, answers = [];

function applyCoupon(c){
  const usable = COUPONS.filter(cp => cp.fit(c));
  let best = null;
  for (const cp of usable){
    let final = c.price, saved = 0;
    if (cp.type === "full" && c.price >= cp.cond){ final = c.price - cp.cut; saved = cp.cut; }
    else if (cp.type === "mcp"){ final = c.price - c.mcpPrice * cp.cut; saved = c.mcpPrice * cp.cut; }
    else if (cp.type === "ratio"){ final = c.price * cp.ratio; saved = c.price - final; }
    if (saved > (best ? best.saved : 0)) best = { cp, final, saved };
  }
  return best || { cp:null, final:c.price, saved:0 };
}

function startQuiz(){
  mode = "quiz"; qi = 0; answers = new Array(QUESTIONS.length).fill(null);

function startMbti(){
  mode = "mbti"; qi = 0; answers = new Array(MBTI_BANK.length).fill(null);
  rollSessionOpts();

function render(){
  const q = sessionQ[qi], opts = sessionOpts[qi];
  document.getElementById("qNo").textContent = "Q" + (qi+1) + " / " + sessionOpts.length;
  document.getElementById("qTitle").textContent = q.q;
  document.getElementById("qSub").textContent = q.sub;
  document.getElementById("dots").innerHTML = QUESTIONS.map((_,i) =>
    `<i class="${i===qi?'on':''}"></i>`).join("");
  document.getElementById("opts").innerHTML = opts.map((o,i) =>
    `<div class="opt" onclick="pick(${i})">${o.t}${o.d?`<small>${o.d}</small>`:""}</div>`).join("");
  document.getElementById("backBtn").classList.toggle("hide", qi === 0);
}
function pick(i){
  answers[qi] = i;
  if (qi < sessionOpts.length-1){ qi++; render(); }
  else finish(answers, false);
}
function prev(){ if (qi > 0){ qi--; render(); } }

/* ============ 方案挑选：定位测试出 2 套（主推 + 差异备选），手气出 1 套 ============ */
function pickPlans(ranked, score, count){
  const used = new Set(), plans = [];
  const push = (c, label, mild=true) => {
    if (c && !used.has(c.name)){ plans.push({...c, _label:label, _mild:mild}); used.add(c.name); }
  };
  if (count === 1){
    // 手气模式：从预算内随机抽 1 套（ranked 已被预算过滤）
    const c = ranked[Math.floor(Math.random() * ranked.length)];
    push(c, "🎰 手气之选", false);
    return plans;
  }
  // 常规：主推 + 差异化备选
  push(ranked[0], "🎯 最匹配", false);
  const rest = ranked.filter(c => !used.has(c.name));
  const alt =
    rest.find(c => c.price <= 15 && c.name !== ranked[0].name) ||                                   // 性价比
    [...rest].sort((a,b) => ((b.v.fresh||0)+(b.v.light||0)) - ((a.v.fresh||0)+(a.v.light||0)))[0] || // 清爽向
    [...rest].sort((a,b) => b.price - a.price)[0];                                                   // 价格差异最大
  push(alt, "🔄 换换口味");
  return plans.slice(0, count);
}

/* ============ 主流程 ============ */
function finish(ansArr, isLucky, budget){
  const score = {};
  if (isLucky) score._lucky = true;
  else ansArr.forEach((ai, qidx) => {
    const w = sessionOpts[qidx][ai].w;
    for (const d in w) score[d] = (score[d]||0) + w[d];
  });

  let ranked, budgetNote = "";
  if (isLucky){
    let pool = COMBOS.map(c => ({ ...c, _deal: applyCoupon(c) }));
    if (budget > 0){
      const inBudget = pool.filter(c => c._deal.final <= budget);
      if (inBudget.length){ pool = inBudget; budgetNote = `（已按预期价格 ≤ ¥${budget} 过滤）`; }
      else budgetNote = `（预算 ¥${budget} 内没有可抽套餐，已放开限制）`;
    }
    ranked = pool.sort(() => Math.random() - 0.5);
  } else {
    ranked = COMBOS.map(c => {
      let s = 0;
      for (const d in c.v) s += (score[d]||0) * c.v[d];
      return { ...c, _s: s };
    }).sort((a,b) => b._s - a._s || Math.random() - 0.5);
  }

  const plans = pickPlans(ranked, score, isLucky ? 1 : 2).map(p => ({...p, _deal: p._deal || applyCoupon(p)}));

  // STEP1
  let s1;
  if (isLucky){
    s1 = `<div class="persona-tag">🎰 天选之人 · 不问不选直接抽</div>
          <div class="pool-note" style="font-size:12.5px;color:var(--muted)">跳过定位直接抽，1 套手气套餐已上桌。</div>`;
  } else if (mode === "mbti"){
    // 性格分析先行：类型 + 强度 + 原型 + 字母解读 + 性格→馋点换算
    const letters = answers.map((ai, qidx) => sessionOpts[qidx][ai].letter).filter(Boolean);
    const type = letters.join("");
    const arch = mbtiArchetype(type);
    const intensity = sessionOpts[4] && sessionOpts[4][answers[4]] ? sessionOpts[4][answers[4]].intensity : "";
    const DIMNAME = { meat:"🥩 肉量", fresh:"🥬 清爽", light:"🍃 轻负担", sweet:"🍬 甜度", salty:"🧂 咸香重口", cool:"🧊 冰爽", hearty:"🍚 扎实碳水" };
    const dims = Object.entries(score).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]).slice(0,4);
    const maxV = Math.max(...dims.map(([,v]) => v), 1);
    s1 = `<div style="font-size:34px;font-weight:900;letter-spacing:6px;color:var(--red);margin-bottom:6px">${type}</div>
          <div class="persona-tag">${arch.name}</div>
          ${intensity?`<div class="persona-tag" style="background:#eef7f0;border-color:#bfe3c9;color:var(--green);margin-left:6px">${intensity}</div>`:""}
          <div style="font-size:13px;line-height:1.9;text-align:left;margin:10px 0 14px">` +
      letters.map(l => `<div>${MBTI_LETTER[l]}</div>`).join("") +
      `</div>
       <div style="font-size:13px;font-weight:bold;text-align:left;margin-bottom:8px">🧬 性格 → 馋点换算</div>` +
      dims.map(([d,v]) => `<div class="dimbar">
        <div class="lbl"><span>${DIMNAME[d]||d}</span><span>${v}</span></div>
        <div class="bar"><div style="width:${Math.round(v/maxV*100)}%"></div></div></div>`).join("") +
      `<div class="reason" style="margin-top:14px">🔍 <b>性格分析：</b>${arch.why}下面按这个人格给你配餐。</div>`;
  } else {
    const DIMNAME = { meat:"🥩 肉量", fresh:"🥬 清爽", light:"🍃 轻负担", sweet:"🍬 甜度", salty:"🧂 咸香重口", cool:"🧊 冰爽", hearty:"🍚 扎实碳水" };
    const dims = Object.entries(score).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]).slice(0,4);
    const maxV = Math.max(...dims.map(([,v]) => v), 1);
    s1 = `<div class="persona-tag">${personName(score)}</div>` +
      dims.map(([d,v]) => `<div class="dimbar">
        <div class="lbl"><span>${DIMNAME[d]||d}</span><span>${v}</span></div>
        <div class="bar"><div style="width:${Math.round(v/maxV*100)}%"></div></div></div>`).join("");
  }

  // STEP2
  const s2 = isLucky
    ? `<div style="font-size:12.5px;color:var(--muted)">🎲 手气模式：从 ${ranked.length} 套${budget ? "预算内" : ""}套餐中随机抽出 1 套${budgetNote}</div>`
    : `<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">套餐池 ${COMBOS.length} 套，匹配度前 3：</div>` +
      ranked.slice(0,3).map((c,i) =>
        `<div class="cand"><span>${i+1}. ${c.name} <small style="color:var(--muted)">¥${c.price}</small></span>
         <span class="score">${Math.round(c._s*10)/10 + " 分"}</span></div>`).join("");

  // STEP3
  const best = plans[0];
  const totalSaved = plans.reduce((a,p) => a + p._deal.saved, 0);
  const s3 = best._deal.cp
    ? `<div class="coupon-note">
         🎟️ ${isLucky ? "这套套餐" : "主推方案"}用券：<b style="color:var(--red)">${best._deal.cp.name}</b>——
         原价 ¥${best.price.toFixed(1)} → 券后 <b>¥${best._deal.final.toFixed(1)}</b>，省 ¥${best._deal.saved.toFixed(1)}。
         ${!isLucky ? `<br>2 套方案各自已配最优券，合计可省 <b style="color:var(--green)">¥${totalSaved.toFixed(1)}</b>。` : ""}
       </div>`
    : `<div class="coupon-note">当前套餐暂无适用立减券${isLucky?"": "（多为已到底价的随心配类）"}。</div>`;

  // STEP4
  document.getElementById("step4Title").textContent = isLucky ? "出餐（手气 1 套）" : "出餐（2 套方案任选）";
  const s4 = `<div class="plans">` + plans.map(p =>
    `<div class="plan ${p._mild ? "" : "best"}">
       <span class="p-label ${p._mild ? "mild" : ""}">${p._label}</span>
       <div class="p-name">${p.name}</div>
       <div class="p-desc">${p.desc}</div>
       <div class="p-price">
         <b>¥${p._deal.final.toFixed(1)}</b>
         ${p._deal.saved>0?`<span class="orig">¥${p.price.toFixed(1)}</span><span class="save">省¥${p._deal.saved.toFixed(1)}</span>`:""}
         ${p._deal.cp?`<br><small>🎟️ ${p._deal.cp.name}</small>`:""}
       </div>
       <div class="p-why">💡 ${p.why}</div>
     </div>`).join("") + `</div>`;

  document.getElementById("quiz").classList.add("hide");
  document.getElementById("home").classList.add("hide");
  document.getElementById("result").classList.remove("hide");
  document.getElementById("step1").innerHTML = s1;
  document.getElementById("step2").innerHTML = s2;
  document.getElementById("step3").innerHTML = s3;
  document.getElementById("step4").innerHTML = s4;
  document.getElementById("finalNote").innerHTML =
    "套餐池与热量数据来自麦当劳官方 MCP（list-nutrition-foods 实时拉取，含安格斯系列、脆汁鸡、叠叠卷及果然多肉/苹板支撑Pro/专薯鱼你/绝代双翅/牛气满满等新品组合）；价格为单点近似价，券为内置模拟券——提供城市或地址后可换绑真实门店价格与真实优惠券。";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function personName(score){
  const hot = Object.entries(score).filter(([k]) => k !== "_lucky").sort((a,b)=>b[1]-a[1])[0];
  if (!hot || hot[1] < 1.5) return "均衡随缘型胃口";
  return { meat:"无肉不欢 · 干饭猛兽", salty:"重口上头 · 刺激猎人", sweet:"糖分依存 · 快乐信徒",
           fresh:"轻盈清爽 · 果蔬派", cool:"冰爽成瘾 · 透心凉星人", hearty:"碳水虔诚 · 主食狂魔" }[hot[0]] || "均衡随缘型胃口";
}

/* 手气套餐：随机抽 1 套，可带预期价格 */
function lucky(){
  const b = parseFloat(document.getElementById("luckyBudget").value);
  finish(null, true, isNaN(b) ? 0 : b);
}
